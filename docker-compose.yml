name: sistema-indicadores

services:
  postgres:
    image: postgres:16-alpine
    container_name: sistema_indicadores_db
    restart: always
    environment:
      POSTGRES_USER: ine_admin
      POSTGRES_PASSWORD: ine_password_2026
      POSTGRES_DB: ine_indicadores_monagas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ine_admin -d ine_indicadores_monagas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
